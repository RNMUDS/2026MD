<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    html,body{margin:0;height:100%;font-family:'Hiragino Sans',sans-serif}
    #hud{position:fixed;left:12px;top:12px;z-index:10;background:rgba(10,10,10,0.82);
      color:#eee;border:1px solid #444;border-radius:10px;padding:12px 14px;max-width:340px;font-size:13px}
    #hud h1{font-size:15px;margin:0 0 6px;color:#76B900}
    #hud button{font-family:inherit;font-size:12px;margin:2px 2px;padding:5px 9px;border-radius:6px;
      border:1px solid #555;background:#222;color:#eee;cursor:pointer}
    #hud button:hover{background:#333}
    #ruleBtn{font-weight:700}
    #status{margin-top:8px;font-size:13px;line-height:1.5}
    #result{margin-top:6px;font-weight:700;font-size:15px;min-height:20px}
    .row{margin:4px 0}
  </style>
</head>
<body>
  <div id="hud">
    <h1>もしオフサイドが無かったら？ シミュレータ</h1>
    <div class="row">ホーム（青）が右のゴールを攻める。<b style="color:#FFB800">黄=オフサイドライン</b>（後ろから2番目の守備選手）。<b style="color:#00e5ff">水色▼</b>があなたの動かすアタッカー。</div>
    <div class="row" style="color:#9ad; font-size:12px">使い方：①「前に走る」でラインを越える → ②「スルーパス！」→ ③「オフサイド: あり／なし」を切り替えて結果を比べる。</div>
    <div class="row">
      <button id="ruleBtn">オフサイド: あり</button>
      <span style="color:#999">← 押して切替</span>
    </div>
    <div class="row">
      アタッカー（◯緑/橙）を動かす：
      <button onclick="CF.move(-4)">◀ 戻す</button>
      <button onclick="CF.move(4)">前に走る ▶</button>
      <button onclick="CF.camp()">ゴール前で待ち伏せ</button>
    </div>
    <div class="row">
      <button onclick="CF.pass()" style="background:#1a3a1a;border-color:#76B900">⚽ スルーパス！</button>
      <button onclick="CF.reset()">リセット</button>
    </div>
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <a-scene background="color: #14181f">
    <a-entity id="group"></a-entity>
    <a-entity id="cam" position="0 11 3.5" rotation="-58 0 0"><a-camera wasd-controls-enabled="false"></a-camera></a-entity>
  </a-scene>

  <script>
  var group = document.querySelector('#group');
  var SCALE = 0.2, ZOFF = -14, Y = 0.6;
  var GOAL_X = 52.5;            // アウェイのゴール（右端）
  function sx(fx){ return fx*SCALE; }
  function sz(fy){ return -fy*SCALE + ZOFF; }

  // ---- 1シーン（ホームが攻撃中の代表的な場面。soccer.csv と同じ座標系[m]）----
  var players = [
    // ball（パサーが持っている）
    {team:'ball', id:0, fx:5,  fy:-2},
    // home（青・右へ攻める）
    {team:'home', id:1, fx:-48, fy:0},
    {team:'home', id:2, fx:-28, fy:-16},{team:'home', id:3, fx:-28, fy:-4},
    {team:'home', id:4, fx:-28, fy:8},  {team:'home', id:5, fx:-28, fy:20},
    {team:'home', id:6, fx:-4, fy:-14}, {team:'home', id:7, fx:5,  fy:-2},   // 7=パサー(ボール保持)
    {team:'home', id:8, fx:2,  fy:12},
    {team:'home', id:10, fx:20, fy:-6, attacker:true},                        // 10=アタッカー(動かせる)
    {team:'home', id:11, fx:18, fy:14},
    // away（赤・右のゴールを守る）
    {team:'away', id:1, fx:48, fy:0, gk:true},                                // GK（最後尾）
    {team:'away', id:2, fx:25, fy:-18},{team:'away', id:3, fx:25, fy:-6},
    {team:'away', id:4, fx:25, fy:6},  {team:'away', id:5, fx:25, fy:18},     // 最終ライン(x=25)
    {team:'away', id:6, fx:6,  fy:-12},{team:'away', id:7, fx:7,  fy:3},
    {team:'away', id:8, fx:9,  fy:15}, {team:'away', id:9, fx:-10, fy:-8},
    {team:'away', id:10, fx:-12, fy:10},{team:'away', id:11, fx:-14, fy:0}
  ];
  var START = JSON.parse(JSON.stringify(players));

  function colorOf(p){
    if(p.team==='ball') return '#ffffff';
    if(p.gk) return p.team==='away' ? '#8e24aa' : '#3949ab';
    return p.team==='home' ? '#2196f3' : '#f44336';
  }

  var els = {}, attacker, ball, ring, marker, offLine, passLine;
  function deco(){
    ring.setAttribute('position', sx(attacker.fx)+' 0.12 '+sz(attacker.fy));
    marker.setAttribute('position', sx(attacker.fx)+' 1.7 '+sz(attacker.fy));
  }
  function build(){
    players.forEach(function(p){
      var el = document.createElement('a-sphere');
      el.setAttribute('radius', p.team==='ball'?0.18:(p.gk?0.42:0.35));
      el.setAttribute('color', colorOf(p));
      el.setAttribute('position', sx(p.fx)+' '+Y+' '+sz(p.fy));
      group.appendChild(el);
      p.el = el;
      if(p.attacker) attacker = p;
      if(p.team==='ball') ball = p;
    });
    // アタッカーの足元リング（オンサイド=緑/オフサイド=橙）
    ring = document.createElement('a-torus');
    ring.setAttribute('radius', 0.55); ring.setAttribute('radius-tubular', 0.06);
    ring.setAttribute('rotation', '-90 0 0');
    group.appendChild(ring);
    // アタッカーの真上に下向きコーン（＝あなたが動かす選手の目印）
    marker = document.createElement('a-cone');
    marker.setAttribute('radius-bottom', 0.24); marker.setAttribute('radius-top', 0);
    marker.setAttribute('height', 0.55); marker.setAttribute('rotation', '180 0 0');
    marker.setAttribute('color', '#00e5ff');
    group.appendChild(marker);
    // オフサイドライン（黄）
    offLine = document.createElement('a-box');
    offLine.setAttribute('color', '#FFB800'); offLine.setAttribute('height', 0.05);
    offLine.setAttribute('depth', 68*SCALE); offLine.setAttribute('width', 0.06);
    group.appendChild(offLine);
    // パスの線
    passLine = document.createElement('a-entity');
    group.appendChild(passLine);
    // ゴール（右端・白）
    var goal = document.createElement('a-box');
    goal.setAttribute('color','#eeeeee'); goal.setAttribute('width',0.15);
    goal.setAttribute('height',1); goal.setAttribute('depth', 7.32*SCALE);
    goal.setAttribute('position', sx(GOAL_X)+' 0.5 '+sz(0));
    group.appendChild(goal);
    // ピッチ（緑）
    var pitch = document.createElement('a-box');
    pitch.setAttribute('color','#2e7d32'); pitch.setAttribute('width',105*SCALE);
    pitch.setAttribute('height',0.08); pitch.setAttribute('depth',68*SCALE);
    pitch.setAttribute('position','0 0 '+ZOFF);
    group.appendChild(pitch);
    refresh();
  }

  function place(p){ p.el.setAttribute('position', sx(p.fx)+' '+Y+' '+sz(p.fy)); }

  function offsideLineX(){
    // アウェイ守備選手を x の大きい順に並べ、2番目（＝最後尾GKの1つ前）
    var xs = players.filter(function(p){return p.team==='away';})
                    .map(function(p){return p.fx;}).sort(function(a,b){return b-a;});
    return xs[1];
  }
  var offsideOn = true;

  function isOffsidePosition(){
    return attacker.fx > offsideLineX() && attacker.fx > ball.fx;
  }

  function refresh(){
    place(attacker);
    var lineX = offsideLineX();
    offLine.setAttribute('position', sx(lineX)+' 0.05 '+ZOFF);
    deco();
    var off = isOffsidePosition();
    ring.setAttribute('color', off ? '#FFB800' : '#76B900');
    var st = document.getElementById('status');
    st.innerHTML = 'オフサイドライン: x = ' + lineX.toFixed(0) + ' m ／ アタッカー: x = ' + attacker.fx.toFixed(0) + ' m<br>'
      + '位置判定: <b style="color:' + (off?'#FFB800':'#76B900') + '">' + (off ? 'オフサイドの位置' : 'オンサイド') + '</b>';
    document.getElementById('ruleBtn').textContent = 'オフサイド: ' + (offsideOn ? 'あり' : 'なし');
    document.getElementById('ruleBtn').style.background = offsideOn ? '#3a1a1a' : '#1a3a1a';
    passLine.removeAttribute('line');
  }

  // ---- 操作 ----
  var CF = {
    move: function(d){ attacker.fx = Math.max(-52, Math.min(52, attacker.fx + d)); document.getElementById('result').textContent=''; refresh(); },
    camp: function(){ attacker.fx = 46; attacker.fy = 2; document.getElementById('result').textContent=''; refresh(); },
    toggle: function(){ offsideOn = !offsideOn; refresh(); },
    reset: function(){ players.forEach(function(p,i){ p.fx=START[i].fx; p.fy=START[i].fy; place(p); }); offsideOn=true; document.getElementById('result').textContent=''; refresh(); },
    pass: function(){ doPass(); }
  };
  window.CF = CF;
  document.getElementById('ruleBtn').addEventListener('click', CF.toggle);

  function tween(p, tx, ty, steps, done){
    var i=0, fx0=p.fx, fy0=p.fy;
    var h=setInterval(function(){
      i++; p.fx = fx0 + (tx-fx0)*i/steps; p.fy = fy0 + (ty-fy0)*i/steps; place(p);
      if(p===attacker){ deco(); }
      if(i>=steps){ clearInterval(h); if(done) done(); }
    }, 40);
  }
  function drawPass(fromP, toP, color){
    passLine.setAttribute('line', {start: sx(fromP.fx)+' '+Y+' '+sz(fromP.fy),
                                   end: sx(toP.fx)+' '+Y+' '+sz(toP.fy), color: color});
  }
  var busy=false;
  function doPass(){
    if(busy) return; busy=true;
    var res=document.getElementById('result');
    var off = isOffsidePosition();
    var flagged = offsideOn && off;
    drawPass(ball, attacker, flagged ? '#FFB800' : '#76B900');
    tween(ball, attacker.fx, attacker.fy, 14, function(){
      if(flagged){
        res.innerHTML = '<span style="color:#FFB800">🚩 オフサイド！ ノーゴール</span>';
        busy=false;
      } else {
        // アタッカー(とボール)がゴールへ → ゴール
        tween(attacker, GOAL_X-3, attacker.fy, 16, function(){
          tween(ball, GOAL_X, attacker.fy, 8, function(){
            res.innerHTML = off
              ? '<span style="color:#76B900">⚽ ゴール！</span> <span style="color:#999;font-size:12px">（本来オフサイドだが、ルール無しなので止められない）</span>'
              : '<span style="color:#76B900">⚽ ゴール！</span>';
            busy=false;
          });
        });
      }
    });
  }
  window.__busy = function(){ return busy; };

  if(document.querySelector('a-scene').hasLoaded) build();
  else document.querySelector('a-scene').addEventListener('loaded', build);
  </script>
</body>
</html>
